<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Reto: Selfie con los Novios</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <style data-purpose="custom-fonts">
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #FAFAFA;
            color: #333;
        }

        h1,
        h2,
        h3,
        .serif-font {
            font-family: 'Playfair Display', serif;
        }
    </style>
    <style data-purpose="custom-utilities">
        .glass-overlay {
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8) 0%, rgba(0, 0, 0, 0.4) 50%, transparent 100%);
        }

        .glass-header {
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.6) 0%, rgba(0, 0, 0, 0) 100%);
        }

        /* Hide scrollbar for horizontal scrolling */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="antialiased h-screen flex flex-col bg-[#FAFAFA]">
    <!-- BEGIN: Header -->
    <header class="sticky top-0 z-50 bg-[#FAFAFA]/90 backdrop-blur-md border-b border-gray-200">
        <div class="flex items-center justify-between px-4 py-3">
            <button
                class="p-2 rounded-full bg-white shadow-sm border border-gray-100 text-gray-700 hover:bg-gray-50 transition">
                <svg fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                    stroke-width="2" viewbox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg">
                    <line x1="19" x2="5" y1="12" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </button>
            <h1 class="text-lg font-semibold serif-font text-gray-900">Detalle de Reto</h1>
            <button
                class="p-2 rounded-full bg-white shadow-sm border border-gray-100 text-gray-700 hover:bg-gray-50 transition">
                <svg fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                    stroke-width="2" viewbox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="1"></circle>
                    <circle cx="19" cy="12" r="1"></circle>
                    <circle cx="5" cy="12" r="1"></circle>
                </svg>
            </button>
        </div>
    </header>
    <!-- END: Header -->
    <!-- BEGIN: Main Content -->
    <main class="flex-1 overflow-y-auto pb-24">
        <!-- BEGIN: Challenge Info -->
        <section class="p-5 bg-white border-b border-gray-100">
            <div class="flex items-start gap-4">
                <div class="p-3 bg-gray-50 rounded-full">
                    <svg class="text-gray-800" fill="none" height="24" stroke="currentColor" stroke-linecap="round"
                        stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24"
                        xmlns="http://www.w3.org/2000/svg">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z">
                        </path>
                        <circle cx="12" cy="13" r="4"></circle>
                    </svg>
                </div>
                <div class="flex-1">
                    <h2 class="text-xl font-bold text-gray-900 serif-font mb-1">Selfie con los Novios</h2>
                    <p class="text-sm text-gray-600 mb-4 leading-relaxed">
                        Sube aquí tu selfie de recuerdo con los novios. ¡Queremos ver esas sonrisas!
                    </p>
                    <!-- Participation Status -->
                    <div
                        class="bg-[#FAFAFA] border border-gray-200 rounded-xl p-4 mb-2 flex items-center justify-between">
                        <div>
                            <p class="text-xs font-medium text-gray-500 uppercase tracking-wider mb-1">Tu estado</p>
                            <p class="text-sm font-semibold text-gray-900 flex items-center gap-1.5">
                                <span class="w-2 h-2 rounded-full bg-green-500"></span>
                                Participando
                            </p>
                        </div>
                        <button
                            class="bg-black text-white text-sm font-medium py-2 px-4 rounded-full hover:bg-gray-800 transition shadow-md flex items-center gap-2">
                            <svg fill="none" height="16" stroke="currentColor" stroke-linecap="round"
                                stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="16"
                                xmlns="http://www.w3.org/2000/svg">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" x2="12" y1="3" y2="15"></line>
                            </svg>
                            Añadir Foto
                        </button>
                    </div>
                </div>
            </div>
        </section>
        <!-- END: Challenge Info -->
        <!-- BEGIN: Gallery Section -->
        <section class="p-4">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-bold text-gray-900 serif-font">Galería del Reto</h3>
                <span class="text-xs font-medium text-gray-500 bg-gray-100 px-2.5 py-1 rounded-full">24 Fotos</span>
            </div>
            <!-- Photo Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 grid-cols-2">
                <!-- Photo Card 1 -->
                <article class="relative rounded-2xl overflow-hidden shadow-sm border border-gray-100 bg-gray-200">
                    <img alt="Selfie de Sofía M." class="w-full h-[280px] object-cover"

                    <!-- Top Overlay: User Info -->
                    <div class="absolute top-0 inset-x-0 p-3 glass-header flex items-center gap-2">
                        <img alt="Avatar" class="w-full h-[280px] object-cover"
                            src="https://lh3.googleusercontent.com/aida-public/AB6AXuClyugT5AGubkV4HswOFtCDCo7jlOR4Z5csCEqConRg9Jv9gzZhiMG3lJSq5f5nETbZYXJb0-nhuL086dgkmEixGJZb_4gok2pThly_2AVGwal1hLi-Pp6PA7cy3_9s-PCaNluN42HbVTMhfzX84s2ZcYWXjHIcZE6rdCNhxKnInWTpBQmGV_XzTBa3q8zvQ_2sQ6qdqUKVnzR94MC4EZrVa2BBYa7Dr5Pe1_6iqHws2GqeGyYDU3cSyw" />
                        <span class="text-sm font-medium text-white drop-shadow-md">Sofía M.</span>
                    </div>
                    <!-- Bottom Overlay: Interactions & Caption -->
                    <div class="absolute bottom-0 inset-x-0 p-4 glass-overlay flex flex-col justify-end">
                        <p class="text-white text-sm mb-3 drop-shadow-md line-clamp-2">¡Los más guapos! Felicidades en
                            su día 🥂✨</p>
                        <div class="flex items-center justify-between text-white/90">
                            <div class="flex items-center gap-4">
                                <button class="flex items-center gap-1.5 hover:text-white transition">
                                    <svg class="text-red-500" fill="currentColor" height="18" stroke="currentColor"
                                        stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                        viewbox="0 0 24 24" width="18" xmlns="http://www.w3.org/2000/svg">
                                        <path
                                            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                                        </path>
                                    </svg>
                                    <span class="text-xs font-medium">12</span>
                                </button>
                                <button class="flex items-center gap-1.5 hover:text-white transition">
                                    <svg fill="none" height="18" stroke="currentColor" stroke-linecap="round"
                                        stroke-linejoin="round" stroke-width="1.5" viewbox="0 0 24 24" width="18"
                                        xmlns="http://www.w3.org/2000/svg">
                                        <path
                                            d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z">
                                        </path>
                                    </svg>
                                    <span class="text-xs font-medium">3</span>
                                </button>
                            </div>
                            <span class="text-[10px] uppercase tracking-wider opacity-75">Hace 2h</span>
                        </div>
                    </div>
                </article>
                <!-- Photo Card 2 -->
                <article class="relative rounded-2xl overflow-hidden shadow-sm border border-gray-100 bg-gray-200">
                    <img alt="Selfie de Carlos T." class="w-full h-[220px] object-cover"
                        src="https://lh3.googleusercontent.com/aida-public/AB6AXuA1fHMTEtoSFMMGjXJ14nrViriGRb4ViyKPScqajZ55p6T2EImwc28hzofoDOSrVDAzhkWLDkK2h7t7-8OOZsX8cEN2SpQBd-7o1sp6IskkaNp1fh1OycaW_dVTli5JBuxfoItiiifFYF-7RD-XFozswCLXsTlz6tKSJfxfteC2jRRNFLKoyOMFDTLXrl9tsXIFeQ4oEwPYAJs3wckJpxu2zJkbdr2Cgp0PrFmUPwYvBHUzx5Rjqdc8nw" />
                    <!-- Top Overlay: User Info -->
                    <div class="absolute top-0 inset-x-0 p-3 glass-header flex items-center gap-2">
                        <img alt="Avatar" class="w-full h-[220px] object-cover"
                            src="https://lh3.googleusercontent.com/aida-public/AB6AXuBWdEIZ0hjqKMz5xvsV1TeEGO_RZcx2jlJwhPfIhO-7SsK6jEHXvo8VfgpWOiEWTGMqeN74w023Y8miqguWrXmJUSgwl5ame27UxPY8gKugnzjkrAkAJ5EDKJoWDAxbpN13CaEQ1oSC9z0weTxQ51oYLNxDfsBUFGXihEQHfDPPL8xcTl_N6Byr5vEgBdUzLB7LyQ-7hc0WX6NEd7sdCjtZ_z3qmfqLuuTrj7si_nryzRsr-FB7Crbeew" />
                        <span class="text-sm font-medium text-white drop-shadow-md">Carlos T.</span>
                    </div>
                    <!-- Bottom Overlay: Interactions & Caption -->
                    <div class="absolute bottom-0 inset-x-0 p-4 glass-overlay flex flex-col justify-end">
                        <p class="text-white text-sm mb-3 drop-shadow-md line-clamp-2">¡Qué fiestón! 🎉</p>
                        <div class="flex items-center justify-between text-white/90">
                            <div class="flex items-center gap-4">
                                <button class="flex items-center gap-1.5 hover:text-white transition">
                                    <svg fill="none" height="18" stroke="currentColor" stroke-linecap="round"
                                        stroke-linejoin="round" stroke-width="1.5" viewbox="0 0 24 24" width="18"
                                        xmlns="http://www.w3.org/2000/svg">
                                        <path
                                            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                                        </path>
                                    </svg>
                                    <span class="text-xs font-medium">8</span>
                                </button>
                                <button class="flex items-center gap-1.5 hover:text-white transition">
                                    <svg fill="none" height="18" stroke="currentColor" stroke-linecap="round"
                                        stroke-linejoin="round" stroke-width="1.5" viewbox="0 0 24 24" width="18"
                                        xmlns="http://www.w3.org/2000/svg">
                                        <path
                                            d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z">
                                        </path>
                                    </svg>
                                    <span class="text-xs font-medium">1</span>
                                </button>
                            </div>
                            <span class="text-[10px] uppercase tracking-wider opacity-75">Hace 3h</span>
                        </div>
                    </div>
                </article>
            </div>
        </section>
        <!-- END: Gallery Section -->
    </main>
    <!-- END: Main Content -->
</body>

</html>
